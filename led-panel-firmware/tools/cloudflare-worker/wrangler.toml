name = "led-panel-ota"
main = "index.js"
compatibility_date = "2026-01-01"

# Bind the R2 bucket. Create the bucket in the Cloudflare dashboard first
# (R2 → Create bucket → name: led-panel-ota), then this binding gives
# the Worker code access to it via env.BUCKET.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "led-panel-ota"

# OTA_TOKEN must be set as an encrypted secret (not a plaintext var):
#   wrangler secret put OTA_TOKEN
# Generate a strong random token first:
#   openssl rand -hex 32
