name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: led-panel-firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('led-panel-firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate include/secrets.h from environment secrets
        env:
          WIFI_SSID: ${{ vars.WIFI_SSID }}
          WIFI_PASSWORD: ${{ vars.WIFI_PASSWORD }}
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_TOKEN: ${{ secrets.OTA_TOKEN }}
        run: |
          cat > include/secrets.h <<EOF
          #pragma once

          // Generated by CI from the production environment secrets.
          // DO NOT commit this file (it is in .gitignore).

          #define WIFI_SSID       "$WIFI_SSID"
          #define WIFI_PASSWORD   "$WIFI_PASSWORD"

          #define MQTT_HOST       "$MQTT_HOST"
          #define MQTT_PORT       8883
          #define MQTT_TOPIC      "led/command"
          #define MQTT_CLIENT_ID  "led-panel-1"
          #define MQTT_USER       "$MQTT_USER"
          #define MQTT_PASS       "$MQTT_PASS"

          // OTA proxy (Cloudflare Worker in front of private R2 bucket).
          // OTA_BASE_URL has no trailing slash, e.g. https://led-panel-ota.<acct>.workers.dev
          #define OTA_BASE_URL    "$OTA_BASE_URL"
          #define OTA_TOKEN       "$OTA_TOKEN"
          EOF

      - name: Build firmware (FIRMWARE_VERSION = tag)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"${{ github.ref_name }}\"
        run: pio run -e esp32dev

      - name: Write release manifest
        # Use spaceless JSON; the ESP32 parser does a strict `"version":"` lookup.
        run: |
          printf '{"version":"%s"}' "${{ github.ref_name }}" > /tmp/manifest.json
          cat /tmp/manifest.json; echo

      - name: Upload firmware.bin + manifest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 cp .pio/build/esp32dev/firmware.bin \
            "s3://${R2_BUCKET}/firmware.bin" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/octet-stream
          aws s3 cp /tmp/manifest.json \
            "s3://${R2_BUCKET}/manifest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json

      - name: Publish MQTT update trigger
        env:
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients
          mosquitto_pub \
            -h "$MQTT_HOST" -p 8883 \
            -u "$MQTT_USER" -P "$MQTT_PASS" \
            --capath /etc/ssl/certs \
            -t led/firmware/update \
            -m "${{ github.ref_name }}"
          echo "[release] published led/firmware/update = ${{ github.ref_name }}"
